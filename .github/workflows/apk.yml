name: APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}

      # 固定签名：项目自带 signingConfigs.local 机制，只要 keystore 在 keystore/ 且给了密码
      - name: Restore fixed signing keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > keystore/SchoolRun.jks

      - run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          KEYSTORE_STORE_PASSWORD: android
          KEYSTORE_KEY_ALIAS: androiddebugkey
          KEYSTORE_KEY_PASSWORD: android

      - uses: actions/upload-artifact@v4
        with:
          name: fuckschoolrun-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
